[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-foundations-to-production"
version = "0.1.0"
description = "Reproducible classical ML, Bayesian inference, deep learning, and MLOps experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.1", "pandas>=2", "matplotlib>=3.7", "joblib>=1.3", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32"]
tracking = ["mlflow>=2.10"]
dev = ["pytest>=7", "httpx>=0.25", "ruff>=0.5"]

[project.scripts]
ml-lab = "ml_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
